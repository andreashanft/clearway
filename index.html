<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B1430" />
    <meta name="description" content="Clear the Hauler's route before it hits anything." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Clearway" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <title>Clearway</title>
    <!-- The loading screen is styled here, not in a stylesheet, so that it shows before
         any script or stylesheet has arrived. -->
    <style>
      html {
        background: #0b1430;
      }

      .cw-loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b1430;
        color: #eef3ff;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        transition: opacity 220ms ease-out;
      }

      .cw-loading[hidden] {
        display: none;
      }

      /* A level load fades in late, so a quick load never flashes the screen. */
      .cw-loading.is-quiet {
        animation: cw-loading-in 160ms ease-out 180ms both;
      }

      .cw-loading.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .cw-loading__box {
        width: min(420px, 100%);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .cw-loading__eyebrow {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        color: #ffd23f;
      }

      .cw-loading__title {
        font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
        font-weight: 900;
        font-size: clamp(44px, 12vw, 72px);
        line-height: 0.9;
        text-transform: uppercase;
      }

      .cw-loading__bar {
        position: relative;
        height: 10px;
        margin-top: 8px;
        overflow: hidden;
        background: rgb(125 170 255 / 0.18);
      }

      .cw-loading__fill {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #ffd23f;
        /* The fill slides in from the left, so its stripes keep their shape. */
        transform: translateX(-96%);
        transition: transform 300ms ease-out;
      }

      /* Stripes that keep moving while the page is busy: the compositor animates them. */
      .cw-loading__fill::after {
        content: '';
        position: absolute;
        inset: 0 -40px;
        background: repeating-linear-gradient(
          -45deg,
          transparent 0 10px,
          rgb(11 20 48 / 0.35) 10px 20px
        );
        animation: cw-loading-stripes 0.7s linear infinite;
      }

      .cw-loading__label {
        min-height: 1.4em;
        font-size: 13px;
        color: #c4d0e8;
      }

      @keyframes cw-loading-in {
        from {
          opacity: 0;
        }
      }

      @keyframes cw-loading-stripes {
        to {
          transform: translateX(28.28px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cw-loading,
        .cw-loading__fill {
          transition: none;
        }

        .cw-loading__fill::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Game view"></canvas>
      <div id="ui"></div>
      <div id="loading" class="cw-loading" role="status" aria-live="polite">
        <div class="cw-loading__box">
          <div class="cw-loading__eyebrow">LOADING</div>
          <div class="cw-loading__title">Clearway</div>
          <div class="cw-loading__bar"><div class="cw-loading__fill"></div></div>
          <div class="cw-loading__label">Loading the game</div>
        </div>
      </div>
    </div>
    <noscript>Clearway needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
